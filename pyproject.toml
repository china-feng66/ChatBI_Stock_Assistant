[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantquery-a"
version = "0.1.0"
description = "Auditable read-only stock research queries and no-lookahead daily backtests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["src"]
